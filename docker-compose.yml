services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentagent
      POSTGRES_PASSWORD: agentagent
      POSTGRES_DB: agentagent
    ports:
      - "5432:5432"
    volumes:
      - agentagent-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentagent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agentagent-pgdata:
